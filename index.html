        <h2 class="mt-4 font-display text-[2.6rem] leading-tight text-brun" data-split data-k="programme.titre"></h2>
        <svg class="reveal mx-auto mt-5 w-24 text-terracotta/70" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>
        <p class="reveal mx-auto mt-6 max-w-xs font-display text-[1.05rem] italic leading-relaxed text-brun-doux" data-k="programme.intro"></p>
      </div>
      <ul id="prog" class="mt-12 divide-y divide-brun/10 border-y border-brun/10"></ul>
    </div>
  </section>

  <!-- ═════════ 5. LE LIEU ═════════ -->
  <section id="lieu" class="bg-creme-deep px-6 py-24 sm:py-32">
    <div class="mx-auto max-w-md md:max-w-xl">
      <div class="text-center">
        <p class="reveal font-cinzel text-[12px] uppercase tracking-[.38em] text-terracotta-fonce" data-k="lieu.surtitre"></p>
        <h2 class="mt-4 font-display text-[2.6rem] leading-tight text-brun" data-split data-k="lieu.titre"></h2>
        <svg class="reveal mx-auto mt-5 w-24 text-terracotta/70" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>
        <h3 class="reveal mt-8 font-display text-2xl text-brun" data-k="lieu.nom"></h3>
        <p class="reveal mt-2 leading-relaxed text-brun-doux" id="lieu-adresse"></p>
      </div>
      <div class="reveal mt-9 overflow-hidden rounded-3xl border border-brun/10 shadow-xl shadow-brun/10">
        <iframe id="map" title="Carte du lieu" class="block h-72 w-full border-0 sm:h-80" style="filter: sepia(.22) saturate(.9)"
          loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
      <div class="reveal mt-8 text-center">
        <a id="itineraire" target="_blank" rel="noopener"
          class="inline-block rounded-full bg-terracotta px-8 py-3.5 font-cinzel text-[12px] font-medium uppercase tracking-[.26em] text-creme-clair shadow-lg shadow-terracotta/25 transition active:scale-95 hover:bg-terracotta-fonce focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brun"></a>
      </div>
    </div>
  </section>

  <!-- ═════════ LA CARTE D'INVITATION (téléchargeable) ═════════ -->
  <section id="carte" class="bg-creme px-6 py-24 sm:py-32">
    <div class="mx-auto max-w-md text-center md:max-w-xl">
      <p class="reveal font-cinzel text-[12px] uppercase tracking-[.38em] text-terracotta-fonce" data-k="carte.surtitre"></p>
      <h2 class="mt-4 font-display text-[2.6rem] leading-tight text-brun" data-split data-k="carte.titre"></h2>
      <svg class="reveal mx-auto mt-5 w-24 text-terracotta/70" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>
      <a id="carte-apercu" target="_blank" rel="noopener" aria-label="Ouvrir la carte d’invitation"
        class="reveal mx-auto mt-10 block w-60 overflow-hidden rounded-xl border border-brun/10 shadow-2xl shadow-brun/25 transition active:scale-[.98]">
        <img id="carte-img" class="block w-full" alt="" loading="lazy" decoding="async">
      </a>
      <p class="reveal mx-auto mt-9 max-w-xs leading-relaxed text-brun-doux" data-k="carte.texte"></p>
      <div class="reveal mt-7" style="--d:.15s">
        <a id="carte-btn" target="_blank" rel="noopener"
          class="inline-flex items-center gap-2.5 rounded-full bg-terracotta px-8 py-3.5 font-cinzel text-[12px] font-medium uppercase tracking-[.22em] text-creme-clair shadow-lg shadow-terracotta/25 transition active:scale-95 hover:bg-terracotta-fonce focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-brun"></a>
        <p class="mt-3 text-[.85rem] text-brun-doux" data-k="carte.note"></p>
      </div>
    </div>
  </section>

  <!-- ═════════ 6. TENUE ═════════ -->
  <section id="tenue" class="bg-creme-deep px-6 py-24 sm:py-32">
    <div class="mx-auto max-w-md text-center md:max-w-xl">
      <p class="reveal font-cinzel text-[12px] uppercase tracking-[.38em] text-terracotta-fonce" data-k="tenue.surtitre"></p>
      <h2 class="mt-4 font-display text-[2.6rem] leading-tight text-brun" data-split data-k="tenue.titre"></h2>
      <svg class="reveal mx-auto mt-5 w-24 text-terracotta/70" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>
      <p class="reveal mx-auto mt-7 max-w-sm leading-relaxed text-brun-doux" data-k="tenue.texte"></p>
      <div id="pastilles" class="mt-10 flex items-start justify-center gap-7"></div>
      <p class="reveal mx-auto mt-10 max-w-xs font-display text-[1.02rem] italic text-brun-doux" data-k="tenue.note" style="--d:.4s"></p>
    </div>
  </section>

  <!-- ═════════ 7. CONFIRMER MA PRÉSENCE ═════════ -->
  <section id="rsvp" class="bg-terracotta px-6 py-24 text-creme-clair sm:py-32">
    <div class="mx-auto max-w-md text-center md:max-w-xl">
      <p class="reveal font-cinzel text-[12px] uppercase tracking-[.38em] text-creme/85" data-k="rsvp.surtitre"></p>
      <h2 class="mt-4 font-display text-[2.6rem] leading-tight" data-split data-k="rsvp.titre"></h2>
      <svg class="reveal mx-auto mt-5 w-24 text-creme/70" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>
      <p class="reveal mx-auto mt-7 max-w-sm leading-relaxed text-creme" data-k="rsvp.texte"></p>
      <div class="reveal mt-9" style="--d:.2s">
        <a id="rsvp-btn" target="_blank" rel="noopener"
          class="inline-block rounded-full bg-creme-clair px-9 py-4 font-cinzel text-[12px] font-medium uppercase tracking-[.26em] text-brun shadow-xl shadow-brun/25 transition active:scale-95 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-creme-clair"></a>
        <p id="rsvp-note" class="mt-4 text-[.85rem] text-creme/85"></p>
      </div>
      <div id="rsvp-contacts" class="reveal mt-8 flex flex-col items-center gap-3" style="--d:.3s"></div>
      <p id="rsvp-limite" class="reveal mt-7 font-display text-[1.05rem] italic text-creme" style="--d:.35s"></p>
    </div>
  </section>
</main>

<!-- ═════════ 8. PIED DE PAGE ═════════ -->
<footer class="bg-brun px-6 pb-[max(3rem,env(safe-area-inset-bottom))] pt-24 text-center text-creme">
  <blockquote class="reveal mx-auto mb-16 max-w-xs">
    <svg class="mx-auto w-20 text-terracotta-clair/70" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>
    <p class="mt-6 font-display text-[1.05rem] italic leading-relaxed text-creme/90" data-k="verset.texte"></p>
    <cite class="mt-3 block font-cinzel text-[10px] not-italic uppercase tracking-[.3em] text-creme/60" data-k="verset.ref"></cite>
  </blockquote>
  <p class="mx-auto max-w-xs font-display text-[1.7rem] italic leading-snug" data-split data-k="pied.merci"></p>
  <p class="reveal mt-5 font-display text-[1.05rem] italic text-creme/80" data-k="pied.benediction" style="--d:.15s"></p>
  <p id="pied-ini" class="reveal mt-10 font-script text-[4rem] leading-none text-terracotta-clair" style="--d:.3s"></p>
  <p id="pied-hash" class="reveal mt-8 font-cinzel text-[12px] uppercase tracking-[.35em] text-creme/85" style="--d:.45s"></p>
  <p id="pied-date" class="reveal mt-3 font-cinzel text-[10px] uppercase tracking-[.3em] text-creme/55" style="--d:.55s"></p>
</footer>

<script>
(() => {
  const C = INVITATION;
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const ini = p => [...p.trim()][0].toUpperCase();
  const pad = n => String(n).padStart(2, '0');

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  // Sections masquées (afficher: false dans le contenu)
  ['familles', 'histoire', 'galerie', 'carte', 'tenue'].forEach(k => { if (!C[k] || C[k].afficher === false) { const s = document.getElementById(k); if (s) s.remove(); } });
  const has = id => !!document.getElementById(id);

  // ───────── Données dérivées ─────────
  const i1 = ini(C.prenom1), i2 = ini(C.prenom2);
  const date = new Date(C.dateISO);
  const dateTxt = cap(new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: C.fuseau }).format(date));
  const dateCourte = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric', timeZone: C.fuseau }).format(date);
  document.title = `${C.prenom1} & ${C.prenom2} · Notre mariage`;

  // ───────── Remplissage des textes ─────────
  $$('[data-k]').forEach(el => { el.textContent = get(C, el.dataset.k) || ''; });

  $('#seal').innerHTML = `${esc(i1)}<span style="font-size:.62em;opacity:.8;margin:0 .1em">&amp;</span>${esc(i2)}`;
  $('#card-sur').textContent = C.accueil.surtitre;
  $('#card-names').textContent = `${C.prenom1} & ${C.prenom2}`;
  $('#card-date').textContent = dateCourte;

  const hero = $('#hero-img');
  hero.src = C.accueil.photo; hero.alt = C.accueil.photoAlt || '';
  $('#hero-sur').textContent = C.accueil.surtitre;
  $('#h-n1').textContent = C.prenom1;
  $('#h-n2').textContent = C.prenom2;
  $('#hero-date').textContent = dateTxt;
  $('#hero-phrase').textContent = C.accueil.phrase;

  // Frise
  if (has('tl')) $('#tl').innerHTML = `
    <span class="absolute bottom-2 left-[11px] top-2 w-px bg-terracotta/20" aria-hidden="true"></span>
    <span id="tl-line" class="absolute bottom-2 left-[11px] top-2 w-px origin-top bg-terracotta" style="transform:scaleY(0)" aria-hidden="true"></span>` +
    C.histoire.etapes.map(e => `
    <li class="tl-item relative pb-14 last:pb-0">
      <span class="tl-dot absolute -left-10 top-0.5 grid h-6 w-6 place-items-center rounded-full border border-terracotta bg-creme"><i class="block h-2 w-2 rounded-full bg-terracotta"></i></span>
      <p class="font-cinzel text-[11px] uppercase tracking-[.3em] text-terracotta-fonce">${esc(e.date)}</p>
      <h3 class="mt-1.5 font-display text-[1.7rem] leading-snug text-brun">${esc(e.titre)}</h3>
      <p class="mt-2 leading-relaxed text-brun-doux">${esc(e.texte)}</p>
    </li>`).join('');

  // Galerie (deux colonnes décalées)
  const ratios = ['aspect-[3/4]', 'aspect-[3/4]', 'aspect-square', 'aspect-[4/5]', 'aspect-square', 'aspect-[3/4]'];
  const colA = $('#gal-a'), colB = $('#gal-b');
  if (colA) C.galerie.photos.slice(0, 6).forEach((p, i) => {
    const f = document.createElement('figure');
    f.className = `ph reveal relative overflow-hidden rounded-2xl bg-creme shadow-lg shadow-brun/10 ${p.format || ratios[i % ratios.length]}`;
    f.style.setProperty('--d', `${(i % 3) * .15}s`);
    f.innerHTML = `<img src="${esc(p.src)}" alt="${esc(p.alt || '')}" loading="lazy" decoding="async" class="h-full w-full object-cover" style="object-position:${esc(p.position || '50% 50%')}">` +
      (p.legende ? `<figcaption class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-brun/75 to-transparent px-3 pb-4 pt-14 text-center font-script text-[2rem] leading-none text-creme-clair">${esc(p.legende)}</figcaption>` : '');
    (i % 2 === 0 ? colA : colB).appendChild(f);
  });

  // Programme
  $('#prog').innerHTML = C.programme.moments.map((m, i) => `
    <li class="reveal grid grid-cols-[5.6rem_1fr] items-baseline gap-4 py-6" style="--d:${(i * .08).toFixed(2)}s">
      <span class="font-cinzel text-[1.05rem] font-medium text-terracotta-fonce">${esc(m.heure)}</span>
      <div>
        <h3 class="font-display text-[1.35rem] leading-snug text-brun">${esc(m.titre)}</h3>
        <p class="mt-1 text-[.95rem] leading-relaxed text-brun-doux">${esc(m.texte)}</p>
      </div>
    </li>`).join('');

  // Lieu
  const L = C.lieu;
  $('#lieu-adresse').innerHTML = `${esc(L.adresse)}<br>${esc(L.ville)}`;
  const q = encodeURIComponent(L.recherche || `${L.nom}, ${L.adresse}, ${L.ville}`);
  $('#map').src = `https://www.google.com/maps?q=${q}&hl=fr&output=embed`;
  const it = $('#itineraire');
  it.href = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
  it.textContent = L.bouton;

  // Tenue
  if (has('pastilles')) $('#pastilles').innerHTML =C.tenue.couleurs.slice(0, 3).map((c, i) => `
    <div class="reveal flex flex-col items-center gap-3" style="--d:${(i * .18).toFixed(2)}s">
      <span class="block h-[4.2rem] w-[4.2rem] rounded-full border border-brun/15 shadow-lg shadow-brun/15" style="background:${esc(c.hex)}"></span>
      <span class="font-cinzel text-[10px] uppercase tracking-[.2em] text-brun-doux">${esc(c.nom)}</span>
    </div>`).join('');

  // RSVP
  const rb = $('#rsvp-btn');
  if (C.rsvp.lien) { rb.href = C.rsvp.lien; rb.textContent = C.rsvp.bouton; $('#rsvp-note').textContent = C.rsvp.boutonNote || ''; } else { rb.parentElement.remove(); }
  $('#rsvp-contacts').innerHTML = (C.rsvp.contacts || []).map(n => {
    const tel = '+229' + n.replace(/\D/g, '');
    return `<a href="tel:${esc(tel)}" class="inline-flex items-center gap-2.5 rounded-full border border-creme-clair/60 px-6 py-3 font-cinzel text-[12px] tracking-[.16em] text-creme-clair transition active:scale-95 hover:bg-creme-clair/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-creme-clair">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      Appeler le ${esc(n)}</a>`;
  }).join('');
  if (C.rsvp.dateLimite) $('#rsvp-limite').innerHTML = `${esc(C.rsvp.phraseLimite)} <strong class="font-medium not-italic">${esc(C.rsvp.dateLimite)}</strong>`;
  else $('#rsvp-limite').remove();

  // Familles
  if (has('fam-noms')) $('#fam-noms').innerHTML = C.familles.liste.map((f, i) => `
    <p class="reveal font-cinzel text-[13px] uppercase leading-[2.1] tracking-[.16em] text-brun" style="--d:${(i * .2).toFixed(2)}s">
      ${esc(f[0])}<br><span class="text-[10px] text-terracotta-fonce">et</span><br>${esc(f[1])}</p>`).join(
    '<svg class="reveal w-16 text-terracotta/60" viewBox="0 0 120 12" fill="none" aria-hidden="true"><path d="M0 6h50M70 6h50" stroke="currentColor" stroke-width=".8"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>');

  // Carte téléchargeable
  if (has('carte')) {
    const K = C.carte;
    const im = $('#carte-img');
    im.src = K.apercu;
    im.alt = `Carte d’invitation au mariage de ${C.prenom1} et ${C.prenom2}`;
    $('#carte-apercu').href = K.fichier;
    const cb = $('#carte-btn');
    cb.href = K.fichier;
    cb.setAttribute('download', K.nomFichier || '');
    cb.innerHTML = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 20h16"/></svg>${esc(K.bouton)}`;
  }

  // Pied de page
  $('#pied-ini').textContent = `${i1} & ${i2}`;
  if (C.pied.hashtag) $('#pied-hash').textContent = C.pied.hashtag; else $('#pied-hash').remove();
  $('#pied-date').textContent = dateCourte;

  // ───────── Titres mot par mot ─────────
  $$('[data-split]').forEach(el => {
    const txt = el.textContent.trim();
    el.setAttribute('aria-label', txt);
    el.innerHTML = txt.split(/\s+/).map((w, i) =>
      `<span class="w" aria-hidden="true"><span class="wi" style="--i:${i}">${esc(w)}</span></span>`).join(' ');
  });

  // ───────── Compte à rebours ─────────
  const cdEls = { j: $('#cd-j'), h: $('#cd-h'), m: $('#cd-m'), s: $('#cd-s') };
  function tick() {
    const diff = date - Date.now();
    if (diff <= 0) {
      $('#cd').classList.add('hidden');
      const msg = $('#cd-msg'); msg.textContent = C.accueil.jourJ; msg.classList.remove('hidden');
      return false;
    }
    const s = Math.floor(diff / 1000);
    cdEls.j.textContent = pad(Math.floor(s / 86400));
    cdEls.h.textContent = pad(Math.floor(s % 86400 / 3600));
    cdEls.m.textContent = pad(Math.floor(s % 3600 / 60));
    cdEls.s.textContent = pad(s % 60);
    return true;
  }
  if (tick()) { const t = setInterval(() => { if (!tick()) clearInterval(t); }, 1000); }

  // ───────── Défilement : frise + profondeur de la galerie ─────────
  const vh = () => window.innerHeight;
  function update() {
    // Frise qui se dessine
    const tl = $('#tl'), line = $('#tl-line'), items = $$('.tl-item');
    if (tl && line) {
      const r = tl.getBoundingClientRect();
      const p = reduce ? 1 : Math.min(1, Math.max(0, (vh() * .72 - r.top) / r.height));
      line.style.transform = `scaleY(${p})`;
      const bottom = r.top + r.height * p;
      items.forEach(el => {
        const d = el.querySelector('.tl-dot').getBoundingClientRect();
        el.classList.toggle('active', reduce || d.top + 12 <= bottom);
      });
    }
    if (reduce || !$('#gal')) return;

    // Galerie : légère profondeur
    const g = $('#gal').getBoundingClientRect();
    const c = g.top + g.height / 2 - vh() / 2;
    colB.style.transform = `translate3d(0, ${(c * -.05).toFixed(1)}px, 0)`;
    $$('.ph img').forEach(img => {
      const b = img.parentElement.getBoundingClientRect();
      const off = b.top + b.height / 2 - vh() / 2;
      img.style.transform = `translate3d(0, ${(off * -.05).toFixed(1)}px, 0) scale(1.22)`;
    });
  }
  let ticking = false;
  const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { update(); ticking = false; }); } };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);

  // ───────── Apparition au défilement ─────────
  function startReveals() {
    document.body.classList.add('ready');
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: .15, rootMargin: '0px 0px -8% 0px' });
    $$('.reveal, [data-split]').forEach(el => io.observe(el));
  }

  // ───────── Ouverture de l'enveloppe ─────────
  const intro = $('#intro'), btn = $('#open-btn');
  function unlock() {
    document.documentElement.classList.remove('locked');
    window.scrollTo(0, 0);
    startReveals(); update();
  }
  btn.addEventListener('click', () => {
    btn.disabled = true;
    if (reduce) {
      intro.classList.add('gone');
      unlock();
      setTimeout(() => intro.remove(), 300);
      return;
    }
    intro.classList.add('open');                          // le rabat s'ouvre, la carte sort
    setTimeout(() => intro.classList.add('out'), 2300);   // la carte s'avance
    setTimeout(() => intro.classList.add('gone'), 2800);  // fondu vers le site
    setTimeout(unlock, 3500);
    setTimeout(() => intro.remove(), 4400);
  });

  update();
})();
</script>
</body>
</html>
